<!doctype html>
<html lang="en" data-i18n-title="page.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07070e">
<title>Ninsei recovery</title>
<link rel="stylesheet" href="./recovery.css">
</head>
<body>
  <!-- WHOSE PAGE THIS IS, BEFORE ANY PASSWORD IS TYPED: a person must be able to tell the page apart from a
       look-alike, so the header is the site's own wordmark. The tag names the job, not a product tier. -->
  <header class="site-head">
    <div class="wrap">
      <span class="logo">
        <span class="glitch" data-text="NINSEI" aria-hidden="true">NINSEI</span>
        <span class="head-tag" aria-hidden="true">recovery</span>
        <span class="sr-only">Ninsei recovery</span>
      </span>
      <!-- LANGUAGE: the list and the labels come from the locale layer, one folder per language. -->
      <label class="field lang">
        <span data-i18n="page.lang"></span>
        <select id="lang"></select>
      </label>
    </div>
  </header>

  <main class="page">
    <div class="intro">
      <h1 data-i18n="page.h1"></h1>
      <p class="note" data-i18n="page.intro"></p>
    </div>

    <!-- THE FLOW IS ONE CARD: the environment line on top, the steps in the order they run, the log at the foot. -->
    <div class="card">
      <div id="preflight" class="status wait" data-i18n="page.preflight"></div>

      <!-- THE NODE IS THE VISITOR'S CHOICE. The default is a public community node, but the page can
           be served anywhere and pointed at a node of that operator's own - then it depends on us in
           nothing. -->
      <section class="step" id="stepNode">
        <h2 data-i18n="page.node.h"></h2>
        <div class="row">
          <label class="field">
            <span data-i18n="page.node.label"></span>
            <input id="node" type="text" spellcheck="false" autocomplete="off" data-i18n-placeholder="page.node.placeholder">
          </label>
          <button id="nodeCheck" type="button" data-i18n="page.node.check"></button>
        </div>
        <p class="hint" data-i18n="page.node.hint"></p>
        <div id="nodeInfo" class="info" hidden></div>
      </section>

      <section class="step">
        <h2 data-i18n="page.step1"></h2>
        <label class="field">
          <span data-i18n="page.field.file"></span>
          <input id="file" type="file" accept=".enc,.json,application/json">
        </label>
        <label class="field">
          <span data-i18n="page.field.pass"></span>
          <input id="pass" type="password" autocomplete="off" spellcheck="false">
        </label>
        <div class="bar">
          <button id="unlock" type="button" class="cta" data-i18n="page.btn.unlock"></button>
        </div>
        <div id="fileInfo" class="info" hidden></div>
      </section>

      <section class="step" id="stepTransfer" hidden>
        <h2 data-i18n="page.step2"></h2>
        <label class="field">
          <span data-i18n="page.field.dest"></span>
          <input id="dest" type="text" spellcheck="false" data-i18n-placeholder="page.field.dest.placeholder">
        </label>
        <p id="destWarn" class="hint warn" hidden></p>
        <label class="field">
          <span data-i18n="page.field.height"></span>
          <input id="restoreHeight" type="text" inputmode="numeric" value="0">
        </label>
        <p class="hint" data-i18n="page.hint.height"></p>
        <div class="bar">
          <button id="sync" type="button" class="cta" data-i18n="page.btn.sync"></button>
          <button id="forget" type="button" class="ghost" data-i18n="page.btn.forget"></button>
        </div>
        <div id="balance" class="info" hidden></div>
      </section>

      <section class="step" id="stepSend" hidden>
        <h2 data-i18n="page.step3"></h2>
        <div class="bar">
          <button id="build" type="button" class="cta" data-i18n="page.btn.build"></button>
          <button id="send" type="button" class="cta" hidden data-i18n="page.btn.send"></button>
        </div>
        <div id="txInfo" class="info" hidden></div>
      </section>

      <pre id="log" class="log" data-i18n="page.log.placeholder"></pre>
    </div>

    <section class="aside">
      <h2 data-i18n="page.keys.head"></h2>
      <ul class="legend">
        <li data-i18n="page.keys.li1"></li>
        <li data-i18n="page.keys.li2"></li>
        <li data-i18n="page.keys.li3"></li>
        <li data-i18n="page.keys.li4"></li>
      </ul>
      <p class="note">
        <span data-i18n="page.diag.lead"></span><a href="./diagnostics.html">diagnostics.html</a><span data-i18n="page.diag.tail"></span>
      </p>
    </section>
  </main>

  <footer class="site-foot">
    <div class="wrap">
      <p class="fine"><span>Ninsei recovery</span><a href="https://github.com/Ninsei-Labs/recovery-page" rel="noopener noreferrer">github.com/Ninsei-Labs/recovery-page</a></p>
    </div>
  </footer>
  <script src="./coi.js"></script>
  <script type="module" src="./recovery.js"></script>
</body>
</html>
