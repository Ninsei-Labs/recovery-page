# A PROXY IN FRONT OF A MONERO NODE, FOR THE BROWSER.
#
# The page cannot talk to monerod directly: a browser requires CORS on every request the page makes,
# and the wallet's binary paths (`/get_blocks_by_height.bin` and friends) are plain endpoints that
# monerod answers without CORS. This block turns a local node into something the page may use, and
# nothing more:
#
#   * it passes exactly the node calls the wallet makes, not the whole RPC surface;
#   * it allows any origin, because the page's own origin is the operator's choice and a wrong list is
#     the failure people hit first. The node holds no credentials and answers public chain data;
#   * it sets CORP so the answers also pass the page's `COEP: require-corp`.
#
# Put it in the same server block that serves the page, or on a host of its own:
#
#   server {
#       listen 443 ssl;
#       server_name xmr.example.com;
#       ...
#       include /etc/nginx/snippets/xmr-proxy.conf;
#   }
#
# Then enter `https://xmr.example.com` in the node field (or link to `?node=https://xmr.example.com`).
# `deploy/own-node.md` has the same setup with a public fallback and a section on why each header is
# needed.

location ~ ^/(json_rpc|get_blocks_by_height\.bin|get_transactions|send_raw_transaction|is_key_image_spent|get_height)$ {
    proxy_pass http://127.0.0.1:18081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # A public node may send CORS headers of its own; two values break the browser.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;

    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Headers "content-type" always;
    add_header Access-Control-Allow-Methods "POST, GET, OPTIONS" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # A wallet asks for blocks in ranges; a large range is one large binary answer.
    proxy_buffering off;
    client_max_body_size 8m;
    proxy_read_timeout 120s;

    if ($request_method = OPTIONS) {
        return 204;
    }
}
