# A PROXY IN FRONT OF A MONERO NODE, FOR THE BROWSER.
#
# The page cannot talk to monerod directly: a browser requires CORS on every request the page makes, and
# monerod sends none. This block turns a local node into something the page may use:
#
#   * monerod runs with `--restricted-rpc`, so it refuses the admin, mining and peer calls itself, and the
#     proxy passes every path to it. A list of allowed paths cannot keep up with the wallet: on stagenet its
#     scan called /json_rpc, /getblocks.bin, /gethashes.bin and /get_transaction_pool_hashes.bin, and the
#     transfer has paths of its own;
#   * it allows any origin, because the page's own origin is the operator's choice and a wrong list is
#     the failure people hit first. The node holds no credentials and answers public chain data;
#   * it sets CORP, so the answers also pass a copy of the page that still sends `COEP: require-corp`.
#
# Every path goes to the node, so give the node a host name of its own:
#
#   server {
#       listen 443 ssl;
#       server_name xmr.example.com;
#       ...
#       include /etc/nginx/snippets/xmr-proxy.conf;
#   }
#
# Then enter `https://xmr.example.com` in the node field (or link to `?node=https://xmr.example.com`).
# `deploy/own-node.md` has the same setup with a public fallback and a section on why each header is
# needed.

location / {
    # 18081 is the mainnet RPC port; a stagenet node listens on 38081.
    proxy_pass http://127.0.0.1:18081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # A public node may send CORS headers of its own; two values break the browser.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;

    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Headers "content-type" always;
    add_header Access-Control-Allow-Methods "POST, GET, OPTIONS" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # A wallet asks for blocks in ranges; a large range is one large binary answer.
    proxy_buffering off;
    client_max_body_size 8m;
    proxy_read_timeout 120s;

    if ($request_method = OPTIONS) {
        return 204;
    }
}
