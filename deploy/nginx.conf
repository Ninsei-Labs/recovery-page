# nginx for the withdrawal page: the contents of `dist/` and nothing else.
#
# The wallet needs no cross-origin isolation, so there is no COEP here. COOP stays: it keeps another
# site from holding a handle to this tab.
#
# THE CSP AND SECURITY HEADERS MIRROR deploy/http-policy.mjs. Nginx cannot import a JS module; the repository's
# checks compare this block with that policy so the two cannot drift. After a change to the listed nodes
# (lib/node.js) or the settlement RPCs (lib/settlement.js), copy the new Content-Security-Policy line from the
# built dist/_headers here.
#
# The CSP is deliberately narrow: same-origin scripts and styles, WebAssembly allowed (`wasm-unsafe-
# eval`, not `unsafe-eval`), workers from this origin or a blob the page creates, images from itself
# and data:. `connect-src` names the hosts the page calls and no other: this origin, the listed Monero
# nodes and the settlement RPCs.

server {
    listen 443 ssl;
    http2 on;
    server_name recovery.example.com;

    root /var/www/ninsei-recovery;   # the contents of dist/
    index index.html;

    ssl_certificate     /etc/ssl/example/fullchain.pem;
    ssl_certificate_key /etc/ssl/example/privkey.pem;

    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self'; img-src 'self' data:; connect-src 'self' https://xmr-node.cakewallet.com:18081 https://node.sethforprivacy.com https://xmr.0xrpc.io https://xmr-stagenet.ninsei.finance https://arb1.arbitrum.io https://arbitrum-one-rpc.publicnode.com https://arbitrum.drpc.org https://sepolia-rollup.arbitrum.io https://arbitrum-sepolia-rpc.publicnode.com https://arbitrum-sepolia.drpc.org; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # The page itself is small and changes with every release: do not let a browser keep an old copy
    # that talks to a new build's stamped bundles.
    location = /index.html { expires -1; }
    location = /diagnostics.html { expires -1; }
    location = /build.json { expires -1; }

    # The page modules are not stamped: `recovery.js` imports `./lib/*.js` without a version. A year on those
    # files serves an old module beside the new page after an update, so they are revalidated instead.
    location ~* \.(css|js)$ { expires -1; }
    location = /monero.worker.js { expires 1h; }

    # MIME types come from the stock mime.types the http block includes. A `types` block here would
    # replace that whole map, and the HTML would go out as the default type.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;   # text/html is always on
    gzip_min_length 1024;
}
