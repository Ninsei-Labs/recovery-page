# nginx for the withdrawal page: the contents of `dist/` and nothing else.
#
# Why the two headers are here and not in the page: the wallet runs WebAssembly with threads and needs
# SharedArrayBuffer, which a browser exposes only to a cross-origin isolated document. COOP and COEP
# are what make the document isolated; no JavaScript can grant that to itself. A host that cannot set
# headers (GitHub Pages, an IPFS gateway) is covered by the page's own service-worker fallback, and
# that fallback is the second-best answer - real headers are this one.
#
# The CSP is deliberately narrow: same-origin scripts and styles, WebAssembly allowed (`wasm-unsafe-
# eval`, not `unsafe-eval`), workers from this origin or a blob the page creates, images from itself
# and data:. `connect-src` names any http(s) host because the node address is the operator's choice -
# delete that freedom and the field on the page stops working.

server {
    listen 443 ssl;
    http2 on;
    server_name recovery.example.com;

    root /var/www/ninsei-recovery;   # the contents of dist/
    index index.html;

    ssl_certificate     /etc/ssl/example/fullchain.pem;
    ssl_certificate_key /etc/ssl/example/privkey.pem;

    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self'; img-src 'self' data:; connect-src 'self' http: https:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # The page itself is small and changes with every release: do not let a browser keep an old copy
    # that talks to a new build's stamped bundles.
    location = /index.html { expires -1; }
    location = /diagnostics.html { expires -1; }
    location = /build.json { expires -1; }
    location = /sw.js { expires -1; }

    # Stamped files carry their own hash in `?v=`, so a year is safe for the bundles and the CSS.
    location ~* \.(css|js)$ { expires 1y; }
    location = /monero.worker.js { expires 1h; }

    types {
        application/javascript  js mjs;
        application/wasm        wasm;
        application/octet-stream bin;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json application/wasm;
    gzip_min_length 1024;

    # A service worker must never be cached by a proxy between the host and the browser.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
}
