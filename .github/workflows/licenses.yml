name: License Compliance

# THE PAGE IS STATIC, BUT ITS BUNDLES ARE NOT DEPENDENCY-FREE. Every package bundled into dist/ must be on the
# permissive allowlist, and the licence texts must travel with the page in THIRD_PARTY_NOTICES.txt. The checker
# reads the installed Bun tree; packages replaced by a browser stub at build time are named in tools/licenses.mjs
# and are not treated as shipped.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: licenses-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install the locked dependencies
        run: bun install --frozen-lockfile

      - name: Check dependency licenses
        run: bun run check:licenses

      # A dependency change that edits bun.lock but not the generated notices reddens here.
      - name: Check third-party notices are current
        run: bun run check:notices

      - name: Test the policy reader
        run: bun run test:licenses
