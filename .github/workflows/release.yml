name: release

# A TAG IS THE ONLY THING THAT MAKES A RELEASE.
#
# `v1.2.3` builds the page, runs the tree's own checks, and attaches one archive to a GitHub
# release: the contents of `dist/` with every hash in `build.json`. Nothing is published to npm -
# the page is not a library, and a registry has no business holding a copy that can drift from the
# release notes.
#
# GitHub Pages is not wired yet. When it is, it will consume the same `dist/` artifact this job
# already produces; the archive is what people can serve today from any host.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      # THE VERSION COMES FROM THE TAG, NOT FROM A HAND-EDITED FILE. `build.json` then names the
      # version of the release it is attached to, and the two cannot disagree. The script replaces the
      # Node package manager step, which this Bun-only build does not use.
      - name: Take the version from the tag
        run: bun tools/version-from-tag.mjs "$GITHUB_REF_NAME"

      - name: Install the locked dependencies
        run: bun install --frozen-lockfile

      - name: Build and check
        run: bun run test

      # THE ARCHIVE IS THE CONTENTS OF dist/, not the repository: an operator unzips it into a web
      # root and has a working page.
      - name: Pack the page
        run: |
          set -eu
          cd dist
          zip -q -r "../ninsei-sweep-${GITHUB_REF_NAME}.zip" .
          cd ..
          sha256sum "ninsei-sweep-${GITHUB_REF_NAME}.zip" > "ninsei-sweep-${GITHUB_REF_NAME}.zip.sha256"
          unzip -l "ninsei-sweep-${GITHUB_REF_NAME}.zip" | tail -3

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          files="ninsei-sweep-${GITHUB_REF_NAME}.zip ninsei-sweep-${GITHUB_REF_NAME}.zip.sha256"
          # A RERUN OF A TAG WHOSE RELEASE EXISTS MUST ATTACH, NOT FAIL. The first v0.1.0 run created the
          # release and failed before the files were attached; a retry has to be able to finish it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files \
              --title "NinseiSwap sweep $GITHUB_REF_NAME" \
              --notes "Static page: unzip and serve the contents over HTTPS with the headers in deploy/. The archive holds dist/ only; every file's SHA-256 is in build.json."
          fi
