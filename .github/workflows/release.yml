name: release

# A TAG IS THE ONLY THING THAT MAKES A RELEASE.
#
# `v1.2.3` builds the page, runs the tree's own checks, and attaches one archive to a GitHub
# release: the contents of `dist/` with every hash in `build.json`. Nothing is published to npm -
# the page is not a library, and a registry has no business holding a copy that can drift from the
# release notes.
#
# The same `dist/` is then served from Cloudflare Pages (project `ninsei-recovery`, at
# recovery.ninsei.finance), the last step below; the archive is what people serve from any other host.

on:
  push:
    tags: ["v*"]
  # A TAG WHOSE FIRST RUN FAILED MUST BE PUBLISHABLE WITHOUT RE-TAGGING. The workflow takes the tag as an input and
  # uses it exactly as a pushed tag: same version, same archive name, same release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write
  actions: read # the CI run of the tagged commit, read before anything is built

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # 25 for the release, 20 for a build run still going on main
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A DISPATCH RUN BUILDS THE TAG IT IS ASKED ABOUT, not the branch the button was pressed on.
          ref: ${{ inputs.tag || github.ref }}

      # A RELEASE IS CUT ONLY FROM A COMMIT ON MAIN WHOSE BUILD PASSED. The run read is the `build` workflow's run of
      # the push to main for this exact commit. A queued or running run is read again every 30 s for at most 20
      # minutes (the job's timeout allows for it); then anything but success (cancelled, failed, missing, still running)
      # refuses the tag before anything is built, archived or deployed. A dispatch run is checked the same way, on the
      # tag it was given.
      - name: The tagged commit is on main and its build passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "$sha" FETCH_HEAD; then
            echo "$TAG is not on main" >&2
            exit 1
          fi
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&branch=main"
          deadline=$((SECONDS + 1200))
          while :; do
            state=$(gh api "$runs" --jq '.workflow_runs[0] | .conclusion // .status // "missing"')
            case $state in
              queued | waiting | pending | requested | in_progress) ;;
              *) break ;;
            esac
            [ $((SECONDS + 30)) -le "$deadline" ] || break
            echo "The build for $sha is $state; reading it again in 30 s"
            sleep 30
          done
          if [ "$state" != success ]; then
            echo "CI has not passed for $sha ($state)" >&2
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      # THE VERSION IS THE TAG, AND THE TWO MUST AGREE. The run fails before building when package.json carries a
      # different version, as the SDK release does; the archive and build.json therefore name the tag the release is
      # attached to. `build.json` reads the same package.json, so there is no second number to update by hand.
      - name: Version must match the tag
        run: bun tools/version-from-tag.mjs "$TAG" --check

      - name: Install the locked dependencies
        run: bun install --frozen-lockfile

      # WRANGLER IS A DEPLOY TOOL, NOT PAGE CODE. It has its own exact lock so the release does not resolve a
      # dependency tree from the registry with the Cloudflare token in the environment. The root licence scan does
      # not see this tree because it is not part of dist/.
      - name: Install the pinned deploy tool
        run: |
          cd tools/deploy
          bun install --frozen-lockfile
          node -e "const p = require('./node_modules/wrangler/package.json'); if (p.version !== '4.147.0') { console.error('wrangler ' + p.version); process.exit(1); }"

      - name: Build and check
        id: check
        run: bun run test

      # A tag can be cut from a commit that never saw the License Compliance workflow. These checks read the
      # installed tree and the committed notices before the archive or the deploy exists.
      - name: Check dependency licenses and notices
        run: |
          bun run check:licenses
          bun run check:notices
          bun run test:licenses

      # THE ARCHIVE IS THE CONTENTS OF dist/, not the repository: an operator unzips it into a web
      # root and has a working page.
      - name: Pack the page
        run: |
          set -eu
          cd dist
          zip -q -r "../ninsei-recovery-${TAG}.zip" .
          cd ..
          sha256sum "ninsei-recovery-${TAG}.zip" > "ninsei-recovery-${TAG}.zip.sha256"
          unzip -l "ninsei-recovery-${TAG}.zip" | tail -3

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          files="ninsei-recovery-${TAG}.zip ninsei-recovery-${TAG}.zip.sha256"
          # A RERUN OF A TAG WHOSE RELEASE EXISTS MUST ATTACH, NOT FAIL. The first v0.1.0 run created the
          # release and failed before the files were attached; a retry has to be able to finish it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files \
              --title "Ninsei recovery page $TAG" \
              --notes "Static page: unzip and serve the contents over HTTPS with the headers in deploy/. The archive holds dist/ only; every file's SHA-256 is in build.json."
          fi

      # CLOUDFLARE PAGES GETS THE dist/ THIS RUN BUILT AND CHECKED, whether or not the archive above was attached:
      # the two are separate copies of one build, and a failure of one must not hold back the other. Two
      # repository secrets: CLOUDFLARE_API_TOKEN (Account, Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID. The
      # project is created on the first deploy; `dist/_headers` carries the isolation headers, which Pages applies.
      # No GitHub app is linked to Cloudflare: the run uploads the files itself, with wrangler run by Bun.
      - name: Deploy the page to Cloudflare Pages
        if: ${{ !cancelled() && steps.check.outcome == 'success' && env.HAS_CLOUDFLARE == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          wrangler="bun tools/deploy/node_modules/wrangler/bin/wrangler.js"
          if ! $wrangler pages project list | grep -qE '(^|[^a-z0-9-])ninsei-recovery([^a-z0-9-]|$)'; then
            $wrangler pages project create ninsei-recovery --production-branch=main
          fi
          # The build wrote dist/ from the tagged commit; the deploy names that commit and the tag.
          $wrangler pages deploy dist --project-name=ninsei-recovery --branch=main \
            --commit-hash="$(git rev-parse HEAD)" --commit-message="$TAG" --commit-dirty=true

      - name: Say the page was not deployed
        if: ${{ !cancelled() && env.HAS_CLOUDFLARE != 'true' }}
        run: echo "CLOUDFLARE_API_TOKEN is not set; the page is not deployed to Cloudflare Pages."
