name: build

# WHAT THIS RUNS ON: a clean machine, no network secrets, no node, no chain. It installs the exact
# versions named in bun.lock, builds dist/, and runs the repository's own checks. If the checks
# pass, the artefact a host should receive is the uploaded `dist/`.
#
# BUN, NOT NODE. The build is esbuild plus a few file operations, and Bun runs both the build and the
# checks (package.json: `test`). This workflow used the Node toolchain until the repository became
# standalone Bun-only, and it failed before the build: there is no Node lock file to install from.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    # A DRAFT PULL REQUEST STARTS NO JOB. The PR is not ready to merge, so its build cannot block anything;
    # `ready_for_review` is the event that starts the first run, and a later push runs again.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install the locked dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting of the changed files
        run: |
          base="${{ github.base_ref }}"
          if [ -z "$base" ]; then base="main"; fi
          git fetch --no-tags --depth=1 origin "$base"
          bun fmt --no-script --check --changed="origin/$base"

      - name: Build and check
        run: |
          # THE CHECKOUT IS THE MERGE COMMIT, BUT THE COMMITTED dist/ CARRIES THE COMMIT IT WAS BUILT FROM.
          # Rebuild with that commit so the footer is identical and the dist comparison tests the page, not the
          # pull request ref.
          commit="$(node -p "require('./dist/build.json').commit || ''")"
          if [ -n "$commit" ]; then export BUILD_COMMIT="$commit"; fi
          bun run test

      # THE COMMITTED ARTEFACT MUST BE THE ONE THE SOURCES BUILD. The build rewrites build.json's commit and time on
      # every run, so that file is excluded; every other byte in dist/ must match the checked-in copy.
      - name: The committed dist matches the build
        run: |
          git diff --exit-code -- dist ':!dist/build.json'
          test -z "$(git status --porcelain --untracked-files=all -- dist ':!dist/build.json')"

      - name: Keep the built page
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-dist
          path: dist
          retention-days: 30
          if-no-files-found: error

  # THE DOCKERFILE IS A DEPLOYABLE ARTEFACT TOO. The build above checks the Bun tree; this job proves the
  # container image still builds and that the image answers its own health check. It pushes nothing.
  docker:
    name: build the container image
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ninsei-recovery:ci
          build-args: |
            BUILD_COMMIT=${{ github.sha }}

      - name: The image serves the page
        run: |
          set -eu
          docker run -d --name recovery-ci -p 127.0.0.1:18080:8080 ninsei-recovery:ci
          trap 'docker rm -f recovery-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/index.html | grep -q "Ninsei recovery"; then
              echo "the image serves index.html"
              exit 0
            fi
            sleep 1
          done
          docker logs recovery-ci || true
          echo "the image did not serve the page in 30 s" >&2
          exit 1
