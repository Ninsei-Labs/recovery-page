name: Dependency scan

# A PULL REQUEST THAT CHANGES DEPENDENCIES IS THE ONE PLACE A HIJACKED PACKAGE CAN ENTER THE PAGE. The scan runs
# only for the files that can change the installed tree, and it complements the build: the page is published from a
# clean run, so a dependency has to be looked at before that run exists.
#
# BUN LIMIT: npmscan-action v1.4.0 reads package.json, npm, yarn and pnpm lockfiles; it does not read bun.lock. This
# scan therefore covers the direct declarations and the root lifecycle scripts, not the transitive tree. The path
# filter still includes bun.lock so a lock change re-runs the direct scan instead of staying invisible.
on:
  pull_request:
    paths:
      - package.json
      - bun.lock

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    name: npmscan dependency check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The scan reads files; it has no reason to keep a push credential in the work tree.
          persist-credentials: false

      # PINNED TO A RELEASE COMMIT, NOT A MOVING TAG: the action itself runs in this repository's CI.
      # mode: warn on the first PRs, so the current tree's advisories are seen before a merge is blocked.
      - name: Scan dependency changes
        uses: npmscan/npmscan-action@83cb7d67204f8f2d1f76454ee9abf19c480dec26 # v1.4.0
        with:
          file: package.json
          mode: warn
          comment: on-findings
          fail-on-error: false
